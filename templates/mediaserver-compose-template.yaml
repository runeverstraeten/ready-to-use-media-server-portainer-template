version: "3.8"

networks:
  media_network:
    name: media_network
    driver: bridge

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOCKER_MODS=linuxserver/mods:jellyfin-opencl-intel
    volumes:
      - ${APPDATA_DIR}/jellyfin/config:/config
      - ${APPDATA_DIR}/jellyfin/cache:/cache
      - ${MEDIA_DIR}:/media
      - ${APPDATA_DIR}/jellyfin/epg:/epg:ro
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
    devices:
      - /dev/dri:/dev/dri # Hardware acceleration actief
    shm_size: "1gb" # Voor transcoding sessies
    networks:
      - media_network
    restart: unless-stopped

  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    network_mode: host
    environment:
      - TZ=${TZ}
      - PLEX_UID=${PUID}
      - PLEX_GID=${PGID}
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ${APPDATA_DIR}/plex/config:/config
      - ${APPDATA_DIR}/plex/transcode:/transcode
      - ${MEDIA_DIR}:/media
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped

  tautulli:
    image: ghcr.io/tautulli/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/tautulli/config:/config
    ports:
      - 8181:8181
    networks:
      - media_network
    restart: unless-stopped

  jellystat-db:
    image: postgres:15
    container_name: jellystat-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${APPDATA_DIR}/jellystat/postgres:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=\({POSTGRES_USER} --username=\){POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - media_network
    restart: unless-stopped

  jellystat:
    image: cyfershepard/jellystat:latest
    container_name: jellystat
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_IP: jellystat-db
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET}
      TZ: ${TZ}
    volumes:
      - ${APPDATA_DIR}/jellystat/backup:/app/backend/backup-data
    ports:
      - 3001:3000
    depends_on:
      jellystat-db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/auth/isConfigured || exit 1
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - media_network
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/radarr/config:/config
      - ${DATA_DIR}:/data
      - ${MEDIA_DIR}:/media
    ports:
      - 7878:7878
    networks:
      - media_network
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/sonarr/config:/config
      - ${DATA_DIR}:/data
      - ${MEDIA_DIR}:/media
    ports:
      - 8989:8989
    networks:
      - media_network
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/bazarr/config:/config
      - ${MEDIA_DIR}:/media
    ports:
      - 6767:6767
    networks:
      - media_network
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    user: "\({PUID}:\){PGID}"
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
      - PORT=5055
    ports:
      - 5055:5055
    volumes:
      - ${APPDATA_DIR}/seerr/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    networks:
      - media_network
    restart: unless-stopped

  prowlarr:
    image: ghcr.io/hotio/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
      - WEBUI_PORTS=9696/tcp 
    volumes:
      - ${APPDATA_DIR}/prowlarr/config:/config
    ports:
      - 9696:9696
    networks:
      - media_network
    restart: unless-stopped

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/transmission/config:/config
      - ${DATA_DIR}:/data
      - ${MEDIA_DIR}:/media 
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    networks:
      - media_network
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ}
    ports:
      - 8191:8191
    volumes:
      - ${APPDATA_DIR}/flaresolverr/config:/config
    networks:
      - media_network
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    environment:
      - TZ=${TZ}
    ports:
      - 8000:8000
      - 9000:9000 # HTTP access
      - 9443:9443 # HTTPS access
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Geeft Portainer toegang tot Docker
      - ${APPDATA_DIR}/portainer/data:/data # Gebruikt jouw mapstructuur
    networks:
      - media_network
    restart: unless-stopped
